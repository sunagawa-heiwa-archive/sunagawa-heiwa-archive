<div>第14回　「横田基地もいらない！ 沖縄とともに声をあげよう  市民交流集会」</div>
<div>の開催日が迫りました。</div>
<div>午前中は映画上映、午後は講演、フルデーのプログラムです。</div>
<div>部分参加もOKで、入場は無料だそうです。</div>
<div>会場の福生市民会館大ホールは、JR青梅線の牛浜駅から徒歩５分です。</div>
