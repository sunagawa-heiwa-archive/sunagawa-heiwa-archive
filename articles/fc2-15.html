<article><h1>平和の礎</h1>
<div class="source">FC2 · 2012-01-01 · <a href="https://sunagawaheiwa.blog.fc2.com/blog-entry-15.html">原始页面</a></div>
<div class="body"><div class="entry-body">
      　１９７５年(昭和５５年)敗戦３０年、砂川闘争２０周年を記念して全国にカンパを呼びかけ砂川町基地拡張反対同盟副行動隊長　宮岡政雄の土地に建立された。<br>　基地闘争で唯一勝利した砂川闘争は｢平和の礎｣として受け継がれていくことを願い砂川から平和を訴え続けるシンボルとなる。文字は宮岡政雄による。<br><div class="fc2_footer" style="text-align:left;vertical-align:middle;height:auto;">
